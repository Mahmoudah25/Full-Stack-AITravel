<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="container">
        <h1>Plan Your Trip</h1>
        <form id="tripForm" action="">
            <div class="form-group">
                <label for="destination">Destination</label>
                <input type="text" id="destination" placeholder="e.g. Cairo" required>
            </div>
            <div class="form-group">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" required>
            </div>
            <div class="form-group">
                <label for="days">Number of Days</label>
                <input type="number" id="days" placeholder="3" min="1" required>
            </div>
            <div class="form-group">
                <label for="budgetAmount">Budget Amount</label>
                <input type="number" id="budgetAmount" placeholder="500" min="1" required>
            </div>
            <div class="form-group">
                <label for="budgetCurrency">Currency</label>
                <input type="text" id="budgetCurrency" value="EGP" readonly required>
            </div>
            <button type="submit" id="submitBtn">Create Trip</button>
            <div id="result"></div>
        </form>
    </div>
     
    <script src="js/trip-service.js"></script>
    <script src="js/trip-form.js"></script>
</body>
</html>
